title:
  value: Optimising Electric Vehicle Charging Station Placement using Advanced Discrete Choice Models
  justification: The title succinctly represents the main focus of the paper, which is on optimizing the placement of charging
    stations for electric vehicles using advanced models.
  quote: Optimising Electric Vehicle Charging Station Placement using Advanced Discrete Choice Models
description: The paper focuses on optimizing the placement of electric vehicle (EV) charging stations to increase EV adoption,
  accounting for budget constraints and user convenience. It utilizes advanced discrete choice models to reflect heterogeneous
  user preferences and complex substitution patterns. The paper proposes an optimization model that accounts for user classes
  and develops a bilevel program reformulated into a maximum covering problem for better computational efficiency.
sustainable_development_is_central:
  value: true
  justification: The central aim of the paper is to enhance the sustainability of transportation by increasing electric vehicle
    adoption through strategic charging station placement, directly addressing a significant source of CO2 emissions.
  quote: In order to meet CO 2 emissions goals, major changes at the global level are necessary. This includes the transportation
    sector, which in 2019 was responsible for 27% of global CO 2 emissions... One initiative that has been proposed to reduce
    these emissions is the adoption of electric vehicles (EVs).
primary_category:
  value: Climate Change Mitigation
  justification: The primary focus is on reducing CO2 emissions by optimizing EV infrastructure, which is a climate change
    mitigation strategy.
  quote: In order to meet CO 2 emissions goals, major changes at the global level are necessary. This includes the transportation
    sector... One initiative that has been proposed to reduce these emissions is the adoption of electric vehicles (EVs).
