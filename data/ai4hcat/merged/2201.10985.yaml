title:
  value: "Jalisco\u2019s Multiclass Land Cover Analysis and Classification Using a Novel Lightweight ConvNet with Real-World\
    \ Multispectral and Relief Data"
  justification: This title encompasses the main objective of the paper, which is applying a lightweight ConvNet for land
    cover analysis and classification in Jalisco using multispectral and relief data.
  quote: The understanding of global climate change, agriculture resilience, and deforestation control rely on the timely
    observations of the Land Use and Land Cover Change (LULCC).
description: The paper presents a novel lightweight convolutional neural network (ConvNet) designed to classify and analyze
  land cover (LC) in the Jalisco region. It addresses challenges specific to regional data, including large class numbers,
  diverse climates, and imbalanced datasets, by utilizing 13 channels of real-world open data. The model demonstrated accuracy
  improvement in LC classification, which aids policy makers in land management, aligning with SDG 15 for 'Life on Land'.
sustainable_development_is_central:
  value: true
  justification: The paper highlights the importance of land cover monitoring in understanding climate change, agricultural
    resilience, and controlling deforestation, all key elements of sustainability.
  quote: The understanding of global climate change, agriculture resilience, and deforestation control rely on the timely
    observations of the Land Use and Land Cover Change (LULCC).
primary_category:
  value: Natural Systems Protection
  justification: The primary focus is on land cover classification and analysis, supporting conservation efforts and ecosystem
    services monitoring, which fits under Natural Systems Protection.
  quote: The understanding of global climate change, agriculture resilience, and deforestation control rely on the timely
    observations of the Land Use and Land Cover Change (LULCC).
secondary_categories:
