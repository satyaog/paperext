title:
  value: 'AmbieGen: A Search-based Framework for Autonomous Systems Testing'
  justification: The title clearly reflects the focus of the paper which is on a framework called AmbieGen for testing autonomous
    systems.
  quote: Thorough testing of safety-critical autonomous systems, such as self-driving cars, autonomous robots, and drones,
    is essential for detecting potential failures before deployment. One crucial testing stage is model-in-the-loop testing,
    where the system model is evaluated...
description: The paper presents AmbieGen, an open-source framework that employs evolutionary search methods to generate test
  scenarios for autonomous systems like autonomous vehicles and robots. The framework aims to address the challenge of exhaustive
  scenario testing by identifying critical test cases that could reveal vulnerabilities or failures in these systems before
  their deployment.
