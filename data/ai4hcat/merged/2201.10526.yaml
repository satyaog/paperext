title:
  value: 'MonarchNet: Differentiating Monarch Butterflies from Butterflies Species with Similar Phenotypes'
  justification: The title clearly indicates the focus of the paper on differentiating monarch butterflies from similar species
    through the MonarchNet system.
  quote: 'MonarchNet: Differentiating Monarch Butterflies from Butterflies Species with Similar Phenotypes'
description: The paper presents MonarchNet, a deep-learning-based system designed to differentiate monarch butterflies from
  other visually similar butterfly species. This system is key to improving the monitoring and tracking of monarch butterfly
  populations and migrations, which are threatened by climate change and other environmental factors. The aim is to facilitate
  accurate butterfly identification to aid scientific research and conservation efforts.
sustainable_development_is_central:
  value: true
  justification: The research focuses on differentiating monarch butterflies, contributing to biodiversity and ecological
    studies, which are crucial for sustainable development. The identification of butterflies is aimed at monitoring population
    trends affected by climate change.
  quote: "In recent years, the monarch butterfly\u2019s iconic migration patterns have come under threat from a number of\
    \ factors, from climate change to pesticide use."
primary_category:
  value: Natural Systems Protection
  justification: The paper focuses on monarch butterflies, an essential part of ecosystems, and the accurate identification
    of these butterflies to monitor their populations and migrations, both of which relate to natural systems protection.
  quote: This research contributes to... the study of the biodiversity and ecology of relevant ecosystems by introducing a
    novel method for tackling this problem.
