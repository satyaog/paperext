title:
  value: An Empirical Analysis of AI Contributions to Sustainable Cities (SDG11)
  justification: This title was selected as it explicitly describes the study's core focus on analyzing AI contributions towards
    sustainable cities, aligning with UN's SDG11.
  quote: An Empirical Analysis of AI Contributions to Sustainable Cities (SDG11)
description: This paper examines how AI systems contribute to advancing Sustainable Development Goal 11, which focuses on
  creating inclusive, safe, resilient, and sustainable cities. The study uses empirical analysis to identify AI's roles in
  waste management, air quality monitoring, disaster response, and transportation management, while emphasizing the potential
  of citizen participation in advancing sustainable urban development.
sustainable_development_is_central:
  value: true
  justification: The paper centrally focuses on AI's role in enhancing sustainable cities and aligns this with SDG11, a critical
    aspect of sustainable development.
  quote: Our analysis revealed that AI systems have indeed contributed to advancing sustainable cities in several ways (e.g.,
    waste management, air quality monitoring, disaster response management, transportation management).
