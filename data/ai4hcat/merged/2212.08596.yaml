title:
  value: De-risking Carbon Capture and Sequestration with Explainable CO2 Leakage Detection in Time-lapse Seismic Monitoring
    Images
  justification: The title clearly states the focus on Carbon Capture and Sequestration (CCS) and the detection of CO2 leakage
    using seismic monitoring images.
  quote: De-risking Carbon Capture and Sequestration with Explainable CO2 Leakage Detection in Time-lapse Seismic Monitoring
    Images
description: The paper discusses the use of deep learning models for detecting CO2 leakage in carbon capture and storage (CCS)
  projects using time-lapse seismic imaging. It introduces binary classification models to identify CO2 plumes and uses Class
  Activation Mapping for localization of leakage regions.
sustainable_development_is_central:
