title:
  value: Memory Efficient Neural Processes via Constant Memory Attention Block
  justification: The title accurately captures the central theme and subject matter of the paper, which is focused on proposing
    a variant of Neural Processes that are memory efficient through the use of Constant Memory Attention Block.
  quote: Memory Efficient Neural Processes via Constant Memory Attention Block
description: This paper introduces Constant Memory Attentive Neural Processes (CMANPs), a variant of Neural Processes designed
  to be memory efficient, making them suitable for deployment in low-resource settings such as IoT devices and mobile robots.
  The proposed CMANPs employ a novel Constant Memory Attention Block (CMAB) which requires constant memory and supports efficient
  computation updates. This approach is particularly relevant for applications with limited energy and memory, as it allows
  for scaling the number of data points while reducing energy-intensive memory access.
