title:
  value: 3D P RE - TRAINING IMPROVES GNN S FOR M OLECULAR P ROPERTY P REDICTION
  justification: The title '3D P RE - TRAINING IMPROVES GNN S FOR M OLECULAR P ROPERTY P REDICTION' directly states the central
    focus of the paper is on improving Graph Neural Networks (GNNs) for predicting molecular properties using 3D pre-training
    techniques.
  quote: 3D P RE - TRAINING IMPROVES GNN S FOR M OLECULAR P ROPERTY P REDICTION Anonymous authors Paper under double-blind
    review
description: The paper discusses a novel approach of pre-training Graph Neural Networks (GNNs) to predict molecular properties
  by utilizing 3D molecular structures even when computationally infeasible scales demand reliance solely on 2D representations.
  The authors propose a method named '3D Infomax', which uses mutual information maximization between 2D and 3D structures
  to embed latent 3D geometric information into GNNs. This technique improves predictions for a variety of molecular properties
  and offers transferable benefits across different molecular datasets.
