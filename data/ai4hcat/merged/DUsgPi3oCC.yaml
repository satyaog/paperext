title:
  value: Conditional Permutation Invariant Flows
  justification: The title clearly reflects the main subject of the paper which introduces a novel conditional generative
    model for handling permutation invariant data.
  quote: We present a conditional generative probabilistic model of set-valued data with a tractable log density. This model
    is a continuous normalizing flow governed by permutation equivariant dynamics.
description: This paper introduces a conditional generative model called Conditional Permutation Invariant Flows, designed
  for set-valued data where the order of data does not affect their probability. The model is based on normalizing flows and
  focuses on tasks such as traffic scene and bounding box generation, showing its robustness in preserving permutation invariance
  while being conditioned on external inputs.
