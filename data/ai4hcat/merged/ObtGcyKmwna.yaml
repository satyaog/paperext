title:
  value: Critic Sequential Monte Carlo
  justification: The title of the paper is directly provided at the beginning of the document.
  quote: "C RITIC S EQUENTIAL M ONTE C ARLO Vasileios Lioutas\u22171,2 , J. Wilder Lavington1,2 , Justice Sefas1,2 , Matthew\
    \ Niedoba1,2 , Yunpeng Liu1,2 , Berend Zwartsenberg1 , Setareh Dabiri1 , Frank Wood1,2,3 , Adam S\u0301cibior1 1 Inverted\
    \ AI, 2 University of British Columbia, 3 Mila; \u2217 vasileios.lioutas@inverted.ai"
description: This paper introduces CriticSMC, a novel algorithm that combines sequential Monte Carlo with learned Soft-Q function
  heuristic factors to enhance planning efficiency in environments with sparse hard constraints, such as collision avoidance
  in autonomous driving. CriticSMC employs these heuristic factors to guide the sampling process in order to improve inference
  and planning, making it particularly useful for AI applications in self-driving vehicles.
