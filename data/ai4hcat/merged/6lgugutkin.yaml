title:
  value: Language Model Alignment with Elastic Reset
  justification: The title is stated at the beginning of the paper and is used as the main reference throughout the document.
  quote: Language Model Alignment with Elastic Reset
description: This paper addresses the challenge of optimizing language models through reinforcement learning (RL) without
  leading to 'language drift,' a common issue where models improve on specific rewards but degrade in performance on other
  tasks. The authors propose a new algorithm, Elastic Reset, which improves reward optimization while mitigating drift. Elastic
  Reset periodically resets the model to an exponential moving average (EMA) of itself which helps maintain improvements from
  pretraining. Experiments demonstrate that this technique achieves better balance between performance and reward optimization
  in tasks like translation and sentiment analysis.
