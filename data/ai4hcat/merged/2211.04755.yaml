title:
  value: Towards Global Crop Maps with Transfer Learning
  justification: The title is 'Towards Global Crop Maps with Transfer Learning,' indicating the focus on creating crop maps
    using transfer learning techniques.
  quote: Towards Global Crop Maps with Transfer Learning
description: This paper presents a deep learning approach for mapping crops using transfer learning with Sentinel-1 satellite
  data. The model, initially developed for paddy rice detection in South Korea, is fine-tuned to detect paddy rice in France
  and Spain and barley in the Netherlands. The study highlights the challenges and possibilities of using deep learning models
  with limited ground samples for crop mapping in different regions and crop types.
sustainable_development_is_central:
  value: true
  justification: The paper's central theme is improving food security and agricultural monitoring by creating precise crop
    maps, which directly impacts sustainable farming practices and climate change adaptation.
  quote: Food security, but also social and economic development are at high risk due to the population growth and climate
    change and the pressure they put on agriculture.
primary_category:
  value: Climate Change Adaptation
  justification: Climate change adaptation involves methods to deal with the impacts of climate change, such as changes in
    agricultural productivity. The paper's focus on improving crop mapping is directly related to adapting agricultural practices
    to better manage food security under climate pressure.
  quote: Precise, dynamic and detailed global crop type maps are essential for monitoring crop production that is under pressure.
secondary_categories: []
primary_sub_category:
  value: Farmers Support
  justification: The sub-category 'Farmers Support' aligns with the paper's objective to improve agricultural practices by
    providing detailed crop maps, which assist farmers in monitoring and management.
  quote: Apart from climate-friendly policies and practices to ensure and promote the increase of agricultural productivity,
    there is also a need of global, timely and precise crop type mapping systems to assist in the monitoring and management
    of agricultural fields.
