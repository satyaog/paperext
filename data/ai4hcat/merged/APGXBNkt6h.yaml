title:
  value: When Do Transformers Shine in RL? Decoupling Memory from Credit Assignment
  justification: The paper's title explicitly highlights its focus on the effectiveness of Transformers in reinforcement learning,
    specifically concerning the roles of memory and credit assignment.
  quote: When Do Transformers Shine in RL? Decoupling Memory from Credit Assignment
description: This paper investigates the efficacy of Transformer architectures in reinforcement learning (RL) by parsing out
  the effects of memory capabilities and credit assignment on the performance of RL tasks. Through defining memory and credit
  assignment quantitatively, the study finds that while Transformers boost long-term memory in RL algorithms to a notable
  extent, they fall short on improving long-term credit assignment.
