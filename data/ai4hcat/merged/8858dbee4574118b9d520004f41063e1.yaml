title:
  value: High-Order Pooling for Graph Neural Networks with Tensor Decomposition
  justification: The title captures the essence of the paper, which focuses on pooling methods using tensor decomposition
    in the context of Graph Neural Networks (GNNs). The paper introduces a new GNN architecture called tensorized GNN (tGNN)
    that utilizes high-order pooling.
  quote: High-Order Pooling for Graph Neural Networks with Tensor Decomposition
description: The paper introduces Tensorized Graph Neural Networks (tGNNs), a novel architecture that uses tensor decomposition
  to model high-order non-linear node interactions in graph neural networks. The tGNN architecture leverages the symmetric
  CP decomposition for efficient parameterization of permutation-invariant multilinear maps and demonstrates superior performance
  in node and graph classification tasks compared to existing methods.
