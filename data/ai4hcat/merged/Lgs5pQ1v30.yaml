title:
  value: 'FedShuffle: Recipes for Better Use of Local Work in Federated Learning'
  justification: The paper introduces 'FedShuffle', an algorithm designed to improve Federated Learning (FL) by addressing
    data imbalance and achieving theoretical convergence guarantees. This is made evident by the focus of the paper and the
    introduced method named 'FedShuffle'.
  quote: In this work, we propose a general recipe, FedShuffle, that better utilizes the local updates in FL, especially in
    this regime encompassing random reshuffling and heterogeneity.
description: This paper introduces FedShuffle, a novel local update method in Federated Learning designed to address challenges
  of data imbalance, client sampling, and random reshuffling. The method provides theoretical convergence guarantees and aims
  to improve upon existing methods like FedAvg and FedNova.
