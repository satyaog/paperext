title:
  value: Predicting the probability distribution of bus travel time to measure the reliability of public transport services
  justification: The title clearly states the focus of the paper on predicting travel time distribution for buses to assess
    public transport reliability.
  quote: Predicting the probability distribution of bus travel time to measure the reliability of public transport services
description: The paper examines predictive models for estimating the probability distribution of bus travel times to improve
  reliability in public transport services. It highlights the use of probabilistic models to predict the conditional probability
  density function of travel times, with a focus on reducing expected secondary delays to enhance service reliability.
