primary_sub_category:
  value: Climate Modeling and Predictions
  justification: The paper's methodology focuses on forecasting oceanic variables, aligning with climate modeling and prediction
    efforts.
  quote: we aim to address a time series forecasting problem in the context of ocean dynamics, proposing a spatio-temporal
    GNN architecture to predict current velocity and sea surface height.
