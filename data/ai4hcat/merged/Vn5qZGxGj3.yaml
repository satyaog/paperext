title:
  value: 'SatBird: Bird Species Distribution Modeling with Remote Sensing and Citizen Science Data'
  justification: The paper introduces the SatBird dataset, specifically designed for modeling bird species distribution using
    remote sensing and citizen science data. This emphasizes the focus on bird species, remote sensing, and citizen science
    data in the title.
  quote: We introduce a novel task for mapping bird species to their habitats by predicting species encounter rates from satellite
    images, and present SatBird1 , a satellite dataset of locations in the USA with labels derived from presence-absence observation
    data from the citizen science database eBird, considering summer (breeding) and winter seasons.
description: The paper introduces SatBird, a dataset that combines remote sensing and citizen science data for bird species
  distribution modeling. The dataset includes bird observation data from the USA and Kenya, derived from eBird, and environmental
  and remote sensing data to enhance the prediction of bird species encounter rates across different regions. The study emphasizes
  the importance of using diverse and large-scale data sources for accurate ecological modeling and conservation planning.
sustainable_development_is_central:
  value: true
  justification: The paper clearly addresses the decline of biodiversity and the importance of understanding species distribution
    for conservation policy planning, positioning it as a central theme.
  quote: Biodiversity is declining at an unprecedented rate, impacting ecosystem services necessary to ensure food, water,
    and human health and well-being. Understanding the distribution of species and their habitats is crucial for conservation
    policy planning.
primary_category:
  value: Natural Systems Protection
  justification: The primary focus is on protecting natural systems through improved biodiversity monitoring using novel data
    sources to model species distribution accurately.
  quote: Understanding the distribution of species and their habitats is crucial for conservation policy planning. However,
    traditional methods in ecology for species distribution models (SDMs) generally focus either on narrow sets of species
    or narrow geographical areas, and there remain significant knowledge gaps about the distribution of species.
