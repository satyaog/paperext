title:
  value: Who Controlled the Evidence? Question Answering for Disclosure Information Extraction
  justification: The paper explicitly introduces a task called 'COIRelationExt' which stands for Conflict of Interest Relationship
    Extraction, focused on extracting disclosure information from research papers.
  quote: Who Controlled the Evidence? Question Answering for Disclosure Information Extraction
description: The paper proposes a novel task called COIRelationExt, focusing on extracting information about relationships
  between sponsoring industries and the studies they sponsor from disclosure statements. The task involves recognizing entities
  and extracting their relationships to the study using a Question Answering-based method, resolving challenges related to
  diverse relationship patterns and low-resource datasets.
