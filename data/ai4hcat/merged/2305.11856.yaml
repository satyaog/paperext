title:
  value: 'Video Killed the HD-Map: Predicting Multi-Agent Behavior Directly From Aerial Images'
  justification: The title summarizes the central contribution of the paper, which is replacing HD maps with aerial images
    for predicting multi-agent behaviors in autonomous driving.
  quote: 'Video Killed the HD-Map: Predicting Multi-Agent Behavior Directly From Aerial Images'
description: The paper proposes a method to enhance multi-agent trajectory predictions in autonomous driving simulations by
  replacing high-definition (HD) maps with aerial image-based maps (AIMs). The AIMs are generated from drone-captured video
  frames, providing rich road context with minimal manual annotation. This innovative approach not only reduces the effort
  involved in manual annotation of HD maps but also improves prediction accuracy, particularly for pedestrian scenarios, thus
  overcoming a bottleneck in scaling human traffic datasets for realistic driving simulations.
