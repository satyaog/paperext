title:
  value: Assessing the impact of aircraft arrival on ambient ultrafine particle number concentrations in near-airport communities
    in Boston, Massachusetts
  justification: The paper's title explicitly indicates that the study focuses on assessing the impact of aircraft arrivals
    on ambient ultrafine particle concentrations in communities near airports, specifically in Boston, Massachusetts.
  quote: Assessing the impact of aircraft arrival on ambient ultrafine particle number concentrations in near-airport communities
    in Boston, Massachusetts
description: The study evaluates the impact of aircraft arrivals on ultrafine particle concentrations in near-airport communities
  around Boston Logan International Airport. It examines real-time aircraft activity and meteorological data to assess how
  aircraft influence particle number concentrations, focusing on identifying aviation contributions amidst other urban sources
  of ultrafine particles.
