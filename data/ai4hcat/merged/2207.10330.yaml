primary_sub_category:
  value: Renewable Energy and Grid Optimization
  justification: The challenge directly targets the integration of renewable energy into the grid and optimization of grid
    operations, primarily through reinforcement learning techniques.
  quote: The goal is to control electricity transportation in power networks... by drastically reducing the share of electricity
    produced by fossil fuels and increasing the share of renewable energies...
