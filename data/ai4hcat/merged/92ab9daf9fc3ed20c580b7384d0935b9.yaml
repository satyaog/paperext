title:
  value: 'PhAST: Physics-Aware, Scalable, and Task-Specific GNNs for Accelerated Catalyst Design'
  justification: 'The title ''PhAST: Physics-Aware, Scalable, and Task-Specific GNNs for Accelerated Catalyst Design'' directly
    reflects the central contribution and focus of the paper, which is the development of novel graph neural networks (GNNs)
    tailored for efficient catalyst discovery.'
  quote: 'PhAST: Physics-Aware, Scalable, and Task-Specific GNNs for Accelerated Catalyst Design'
description: The paper presents PhAST, a framework of novel graph neural networks (GNNs) designed to accelerate the discovery
  of efficient catalysts that are critical to low-carbon energy processes. PhAST improves the computational efficiency and
  accuracy of GNNs for electrocatalyst design through task-specific architectural innovations. This includes novel methods
  for graph creation, atom representation, and energy prediction, which significantly enhance performance and scalability
  compared to existing models. PhAST can also thrive in CPU-based training settings, enabling broader accessibility.
