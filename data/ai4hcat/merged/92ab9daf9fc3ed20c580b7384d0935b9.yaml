primary_category:
  value: Climate Change Mitigation
  justification: The paper centers on the use of machine learning for the accelerated discovery of efficient catalysts, which
    are vital for reducing energy consumption and carbon emissions in industrial processes, thereby directly contributing
    to climate change mitigation.
  quote: Mitigating the climate crisis requires a rapid transition towards lower-carbon energy. Catalyst materials play a
    crucial role in the electrochemical reactions involved in numerous industrial processes key to this transition, such as
    renewable energy storage and electrofuel synthesis.
