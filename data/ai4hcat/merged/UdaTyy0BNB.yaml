title:
  value: Double Gumbel Q-Learning
  justification: The title accurately reflects the main contribution of the paper, which is the introduction of a new algorithm
    called Double Gumbel Q-Learning.
  quote: Double Gumbel Q-Learning
description: This paper introduces Double Gumbel Q-Learning, a new Deep Q-Learning algorithm that accounts for heteroscedastic
  Gumbel noise in reinforcement learning. The algorithm is designed for both discrete and continuous control, offering improvements
  over existing methods like DDPG, TD3, and SAC. It presents a new loss function and a hyperparameter for tuning pessimism
  in Q-Learning, achieving better performance across various tasks.
