title:
  value: 'AICOM-MP: AN AI- BASED MONKEYPOX DETECTOR FOR RESOURCE -CONSTRAINED ENVIRONMENTS'
  justification: The title is directly taken from the paper, accurately reflecting its content and focus on an AI-based monkeypox
    detector.
  quote: 'AICOM-MP: AN AI- BASED MONKEYPOX DETECTOR FOR RESOURCE -CONSTRAINED ENVIRONMENTS'
description: The paper discusses the development and implementation of AICOM-MP, an AI-based tool designed to detect monkeypox
  in images from resource-constrained environments, like low-end mobile devices. This tool aims to improve healthcare access
  in least developed countries by being part of Autonomous Mobile Clinics (AMCs), which are autonomous vehicles equipped with
  medical diagnostic equipment and AI technology. The AICOM-MP tool achieves state-of-the-art accuracy by using a comprehensive
  dataset and attention model inspired by medical professionals' diagnostic practices. The research emphasizes making the
  technology universally accessible, including through offline capabilities.
