title:
  value: Probabilistic Surrogate Networks for Simulators with Unbounded Randomness
  justification: The chosen title captures the paper's main focus on developing surrogate networks for simulators characterized
    by unbounded randomness.
  quote: We present a framework for automatically structuring and training fast, approximate, deep neural surrogates of stochastic
    simulators.
description: The paper introduces a framework for building deep neural network surrogates for stochastic simulators where
  the number of random variables can be unbounded. It discusses the efficiency and speed of these surrogates in modeling complex
  stochastic programs and enabling faster simulations and Bayesian inference. The paper also illustrates the application of
  the framework through stochastic control flows, program synthesis, and composite materials process simulation.
sustainable_development_is_central:
  value: false
  justification: The paper primarily focuses on the development of a deep learning framework for surrogate modeling in simulators.
    Although there is mention of an application in composite materials, the core theme is not centered on Climate or Ecological
    Sustainable Development.
