  value: "Do SSL Models Have D\xE9j\xE0 Vu? A Case of Unintended Memorization in Self-supervised Learning"
  justification: The title concisely reflects the key subject matter of the paper which explores the unintended memorization
    phenomenon in self-supervised learning models.
  quote: "Do SSL Models Have D\xE9j\xE0 Vu? A Case of Unintended Memorization in Self-supervised Learning"
description: This paper investigates the unintended memorization phenomenon in self-supervised learning (SSL) algorithms,
  which can memorize specific parts of training images rather than learning generalized representations. The paper highlights
  privacy risks associated with this memorization and suggests potential mitigation strategies.
