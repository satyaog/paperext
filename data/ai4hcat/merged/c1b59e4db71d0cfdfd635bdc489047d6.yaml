title:
  value: Model-based graph reinforcement learning for inductive traffic signal control
  justification: The title clearly summarizes the focus of the paper, which is on using model-based reinforcement learning
    combined with graph neural networks for traffic signal control.
  quote: Model-based graph reinforcement learning for inductive traffic signal control
description: The paper introduces MuJAM, a model-based reinforcement learning method for adaptive traffic signal control (ATSC).
  The approach uses graph neural networks to handle changing inputs and environments, facilitating zero-shot transfer to new
  road-network topologies and traffic distributions.
