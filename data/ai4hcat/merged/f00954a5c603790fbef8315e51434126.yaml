title:
  value: 'FairPrism: Evaluating Fairness-Related Harms in Text Generation'
  justification: The title clearly reflects the main focus of the paper on FairPrism, a dataset evaluating fairness-related
    harms in AI text generation.
  quote: We introduce FairPrism, a dataset of 5,000 examples of AI-generated English text with detailed human annotations
    covering a diverse set of harms relating to gender and sexuality.
description: This paper introduces FairPrism, a dataset developed to assess and mitigate fairness-related harms in AI-generated
  text, particularly focusing on gender and sexuality-related harms. It highlights the limitations of existing datasets and
  provides recommendations for developing more effective tools for harm measurement and mitigation in AI text systems.
