title:
  value: 'Bugs in the Data: How ImageNet Misrepresents Biodiversity'
  justification: The paper focuses on analyzing the wildlife-related data in ImageNet-1k and how it misrepresents biodiversity.
  quote: 'Bugs in the Data: How ImageNet Misrepresents Biodiversity'
description: The paper analyzes the representation of biodiversity in the ImageNet-1k dataset, identifying significant biases,
  inaccuracies, and geographical misrepresentations in the dataset's wildlife classes. It involves input from expert ecologists
  to validate class definitions and image accuracy. It addresses issues of incorrect labeling, class overlap, geographical
  and cultural biases, and the implications for ML models trained using this data.
