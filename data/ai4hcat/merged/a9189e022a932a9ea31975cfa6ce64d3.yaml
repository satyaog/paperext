title:
  value: The load planning and sequencing problem for double-stack trains
  justification: The title clearly specifies the focus of the paper, which is on the load planning and sequencing problem
    for double-stack trains. It encompasses both the planning and execution of loading sequences for efficiency.
  quote: The load planning and sequencing problem for double-stack trains
description: This paper focuses on the integrated load planning and sequencing problem for double-stack trains at intermodal
  railway terminals. It aims to optimize the assignment of containers from storage to railcars and improve the loading sequence,
  reducing container handling by using integer linear programming formulations. The study shows significant efficiencies in
  operation with potential reductions in container handlings, specifically benefiting gantry cranes and reach stackers.
