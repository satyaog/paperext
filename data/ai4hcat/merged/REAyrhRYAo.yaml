title:
  value: Gradient Masked Averaging for Federated Learning
  justification: The title precisely captures the main technique (Gradient Masked Averaging) and its context (Federated Learning),
    as discussed extensively in the abstract and body of the paper.
  quote: Abstract Federated learning (FL) is an emerging paradigm that permits a large number of clients with heterogeneous
    data to coordinate learning of a unified global model without the need to share data amongst each other...Inspired from
    recent works in Outof-Distribution generalization, we propose a gradient masked averaging approach for FL as an alternative
    to the standard averaging of client updates.
description: The paper introduces Gradient Masked Averaging (GMA) as an alternative technique in Federated Learning to tackle
  data heterogeneity and improve generalization. GMA replaces standard parameter averaging in federated algorithms with a
  method focusing on learning invariant mechanisms relevant across different distributed data, thereby enhancing model performance,
  especially under non-i.i.d conditions.
