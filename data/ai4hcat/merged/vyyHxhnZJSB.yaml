title:
  value: 'GrowSpace: Learning How to Shape Plants'
  justification: 'The title ''GrowSpace: Learning How to Shape Plants'' clearly reflects the focus of the paper on using reinforcement
    learning to control plant growth, which is integral to its proposed environment.'
  quote: 'GrowSpace: Learning How to Shape Plants'
description: This paper introduces GrowSpace, a reinforcement learning (RL) benchmark environment designed to simulate and
  control the growth of plants in response to light manipulation. The objective is to train agents to guide plant growth towards
  specific goals by adjusting a light source. The environment uses the Space Colonization Algorithm to model plant growth
  based on phototropism, allowing for experiments on control, hierarchical learning, fairness, and multi-objective learning.
  GrowSpace is meant to address real-world challenges in plant science and RL by providing a simulated platform for controlled
  plant growth studies.
