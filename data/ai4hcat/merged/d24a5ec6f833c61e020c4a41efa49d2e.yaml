title:
  value: 'Trade-off between accuracy and fairness of data-driven building and indoor environment models: A comparative study
    of pre-processing methods'
  justification: The title clearly reflects the content of the paper, focusing on the balance between accuracy and fairness
    in data-driven models related to buildings and indoor environments.
  quote: 'Trade-off between accuracy and fairness of data-driven building and indoor environment models: A comparative study
    of pre-processing methods'
description: This paper explores the balance between accuracy and fairness in data-driven models for building and indoor environments.
  It introduces three types of fairness in building engineering, examines two types of fairness, and proposes pre-processing
  methods to improve fairness in predictive models used for lighting status prediction. The study compares these methods in
  terms of their impact on accuracy and fairness across various scenarios.
sustainable_development_is_central:
  value: true
  justification: The central focus of the paper is on improving the predictive accuracy and fairness of data-driven models
    used in energy management and indoor environments, which directly ties to sustainability by enhancing energy efficiency
    in buildings.
  quote: This paper addresses a new research problem called fairness-aware prediction of data-driven building and indoor environment
    models.
primary_category:
  value: Climate Change Mitigation
  justification: The study focuses on data-driven models for buildings, specifically looking at energy management and efficiency,
    which aligns with climate change mitigation efforts through improved energy efficiency in buildings.
  quote: "These models could be further integrated into a model predictive controller (MPC) that can predefine optimal control\
    \ signals based on users\u2019 demand, and control relevant devices via HEMS to achieve cost/energy saving, or peak shifting."
