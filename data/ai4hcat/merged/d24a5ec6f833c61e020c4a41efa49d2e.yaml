primary_sub_category:
  value: Energy Efficiency in Buildings
  justification: The paper's focus is on building and indoor environment models which are used to predict variables that can
    influence energy management in buildings, directly correlating with energy efficiency improvements.
  quote: 'As smart home energy management systems (HEMS) and sensors are rapidly gaining popularity, an abundance of information
    could be dynamically collected from buildings [1]. This has increased attention to developing data-driven prediction models
    for: indoor air temperature, building energy consumption, occupants'' thermal comfort.'
