title:
  value: 'SmOOD: Smoothness-based Out-of-Distribution Detection Approach for Surrogate Neural Networks in Aircraft Design'
  justification: The paper title accurately reflects its focus on developing a new detection approach (SmOOD) for surrogate
    neural networks in aircraft design.
  quote: 'SmOOD: Smoothness-based Out-of-Distribution Detection Approach for Surrogate Neural Networks in Aircraft Design'
description: The paper introduces SmOOD, a smoothness-based out-of-distribution detection approach for surrogate neural networks,
  particularly in aircraft design. It addresses the challenges faced by feedforward neural networks in design optimization
  due to their inability to generalize well to out-of-distribution samples. SmOOD uses the smoothness properties of high-fidelity
  simulations to detect OODs, ensuring the surrogate model produces reliable predictions. This method is assessed across various
  aircraft performance models, demonstrating improved predictive performance and computational efficiency compared to Gaussian
  Process models.
sustainable_development_is_central:
  value: false
  justification: Although the paper deals with optimization in aircraft design, which can indirectly impact resource efficiency,
    the central focus is on computational efficiency and model performance in detecting out-of-distribution samples, rather
    than on climate or ecological sustainability.
  quote: Aircraft industry is constantly striving for more efficient design optimization methods in terms of human efforts,
    computation time, and resources consumption.
