title:
  value: 'Greenhouse gases emissions: estimating corporate non-reported emissions using interpretable machine learning'
  justification: The title is stated clearly in the paper and reflects the core focus of the study, which is estimating corporate
    greenhouse gas emissions using machine learning.
  quote: 'Greenhouse gases emissions: estimating corporate non-reported emissions using interpretable machine learning'
description: This paper proposes a machine learning-based model to estimate scope 1 and scope 2 greenhouse gas emissions for
  companies that have not reported their emissions. The model is designed to be interpretable and compares favorably with
  existing methodologies, yielding more accurate results. It includes a detailed methodological approach and validation against
  known datasets to ensure its accuracy and robustness.
sustainable_development_is_central:
  value: true
  justification: The central theme of the paper is estimating greenhouse gas emissions, which directly relates to sustainable
    development through environmental accountability and emissions reduction strategies.
  quote: GHG emissions reporting and auditing are not yet compulsory for all companies... We propose a machine learning-based
    model to estimate scope 1 and scope 2 GHG emissions of companies not reporting them yet.
