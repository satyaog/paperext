title:
  value: A Halfspace-Mass Depth-Based Method for Adversarial Attack Detection
  justification: The paper introduces a method called HAMPER using halfspace-mass depth for detecting adversarial attacks,
    which is the core focus of the research.
  quote: In this paper, we introduce the HalfspAce Mass dePth dEtectoR (HAMPER), a new method to detect adversarial examples
    by leveraging the concept of data depths.
description: This paper proposes a new method called HAMPER for detecting adversarial attacks in machine learning models.
  It utilizes the concept of data depths, specifically the halfspace-mass depth, to detect anomalies in high-dimensional spaces.
  The paper claims that HAMPER outperforms state-of-the-art methods for adversarial detection across multiple benchmarks and
  provides evidence of its effectiveness through extensive experimentation.
