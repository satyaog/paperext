title:
  value: RESOURCE-EFFICIENT SEPARATION TRANSFORMER
  justification: The title clearly states the central focus of the paper, which is the development of a resource-efficient
    variant of the Transformer model for speech separation.
  quote: RESOURCE-EFFICIENT SEPARATION TRANSFORMER
description: The paper presents the Resource-Efficient Separation Transformer (RE-SepFormer), an architecture for Transformer-based
  speech separation. The model emphasizes computational efficiency, reducing parameters and operations compared to previous
  architectures while maintaining performance. The paper focuses on adapting Transformers for reduced computational burden
  using non-overlapping blocks and compact latent summaries. The RE-SepFormer is tested on WSJ0-2Mix and WHAM! datasets in
  both causal and non-causal settings, achieving competitive results with significantly decreased memory and inference time.
