title:
  value: 'Bugs in Machine Learning-based Systems: A Faultload Benchmark'
  justification: The title accurately describes the focus of the paper on providing a benchmark for bugs in machine learning
    systems.
  quote: 'Bugs in Machine Learning-based Systems: A Faultload Benchmark'
description: This paper discusses the creation of a faultload benchmark, called defect4ML, which documents bugs in machine
  learning systems using TensorFlow and Keras. It addresses the reproducibility and verifiability of these bugs, providing
  a standard benchmark to evaluate ML-based systems' software reliability engineering practices.
