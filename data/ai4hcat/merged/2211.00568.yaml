title:
  value: Consistent Training via Energy-Based GFlowNets for Modeling Discrete Joint Distributions
  justification: The title clearly states the focus on energy-based GFlowNets to model joint distributions, which is the central
    methodological advance discussed in the paper.
  quote: Consistent Training via Energy-Based GFlowNets for Modeling Discrete Joint Distributions
description: The paper introduces Joint Energy-Based GFlowNets (JEBGFNs), which extend the capabilities of GFlowNets by combining
  them with energy-based models to jointly learn multiple variables, such as biological sequences and their properties like
  antimicrobial activity. It focuses on improving the diversity and adaptability of generated biological sequences for applications
  like antimicrobial peptide generation. The paper evaluates the performance of these models in generating diverse and high-scoring
  antimicrobial peptides and in active learning contexts.
