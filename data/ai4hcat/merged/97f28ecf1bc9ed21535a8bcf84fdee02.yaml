title:
  value: 'Reincarnating Reinforcement Learning: Reusing Prior Computation to Accelerate Progress'
  justification: The paper discusses the concept of reincarnating reinforcement learning by reusing prior computation to enhance
    the efficiency and democratization of reinforcement learning applications.
  quote: 'Title: Reincarnating Reinforcement Learning: Reusing Prior Computation to Accelerate Progress'
description: The paper presents reincarnating reinforcement learning (RRL), an approach to reuse prior computational work
  in reinforcement learning instead of starting from scratch. This approach seeks to leverage existing policies and learned
  data to accelerate the training of RL agents, making RL research more accessible to institutions with limited computational
  resources. The paper focuses on policy-to-value reincarnating RL and introduces a new method, QDagger, demonstrating its
  effectiveness in various settings such as Atari games and real-world problems like navigation of stratospheric balloons.
