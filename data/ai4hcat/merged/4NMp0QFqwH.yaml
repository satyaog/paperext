title:
  value: Joint Bayesian Inference of Graphical Structure and Parameters with a Single Generative Flow Network
  justification: The title captures the essence of the paper, which is about using a Generative Flow Network (GFlowNet) for
    joint Bayesian inference of the structure and parameters of Bayesian Networks.
  quote: Joint Bayesian Inference of Graphical Structure and Parameters with a Single GFlowNet
description: This paper introduces a method using Generative Flow Networks (GFlowNets) to approximate the joint posterior
  distribution over both the structure and parameters of Bayesian Networks. The approach aims to address challenges in Bayesian
  structure learning by providing an accurate approximation of the joint posterior, leveraging advances in non-discrete sample
  spaces. The method is evaluated against existing approaches on both simulated and real data, demonstrating favorable results.
