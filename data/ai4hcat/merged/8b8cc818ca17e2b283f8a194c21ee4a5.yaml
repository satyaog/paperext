title:
  value: 'In-Processing fairness improvement methods for regression Data-Driven building Models: Achieving uniform energy
    prediction'
  justification: The title is directly extracted from the paper, capturing the core focus on improving fairness in regression
    models for building energy predictions.
  quote: 'In-Processing fairness improvement methods for regression Data-Driven building Models: Achieving uniform energy
    prediction'
description: This paper discusses methods to improve fairness in regression data-driven building models, specifically for
  energy prediction. The proposed in-processing methods add fairness-related penalties or constraints to the loss functions
  to ensure uniform predictive performance across different conditions, such as varying occupancy movements.
