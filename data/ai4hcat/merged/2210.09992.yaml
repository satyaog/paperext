title:
  value: Optimal Event Monitoring through Internet Mashup over Multivariate Time Series
  justification: The paper focuses on a framework and methodology for optimizing event monitoring over multivariate time series
    using web mashups.
  quote: We propose a Web-Mashup Application Service Framework for Multivariate Time Series Analytics (MTSA) ... At the end,
    we conduct an experimental case study for a university campus microgrid as a practical example to demonstrate our proposed
    framework, models, and language.
description: The paper discusses a Web-Mashup Application Service Framework for multivariate time series analytics (MTSA),
  designed to enhance event monitoring by combining domain knowledge and formal learning techniques. It uses a case study
  involving electric power management in a microgrid to illustrate its application.
