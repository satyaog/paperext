title:
  value: Memory-Aware Functional IR for Higher-Level Synthesis of Accelerators
  justification: The title reflects the core content and focus of the paper, which discusses a memory-aware intermediate representation
    used for synthesizing hardware accelerators.
  quote: Memory-Aware Functional IR for Higher-Level Synthesis of Accelerators
description: This paper presents a novel functional intermediate representation (Shir) for synthesizing hardware accelerators
  on FPGAs. The IR explicitly manages memory operations and parallelism, allowing efficient synthesis of hardware from high-level
  programming abstractions. The approach is demonstrated with stencil computations and matrix-matrix multiplication on an
  FPGA, showing competitive performance with optimized OpenCL implementations.
