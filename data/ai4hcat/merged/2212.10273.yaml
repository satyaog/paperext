title:
  value: 'Managing Large Dataset Gaps in Urban Air Quality Prediction: DCU-Insight-AQ at MediaEval 2022'
  justification: The title clearly indicates the primary focus of the paper, which is related to managing gaps in urban air
    quality data for prediction purposes.
  quote: 'Managing Large Dataset Gaps in Urban Air Quality Prediction: DCU-Insight-AQ at MediaEval 2022'
description: The paper addresses the challenge of predicting Air Quality Index (AQI) in urban areas, specifically in the context
  of large data gaps often present in sensor data. The authors propose methods for filling in these gaps using multimodal
  data, including weather and traffic images, and employing machine learning models to improve the prediction accuracy of
  AQI over several days. This approach is particularly relevant for situations where air quality sensors fail or data is sparse,
  which is a common issue in low-income areas.
sustainable_development_is_central:
  value: true
  justification: The central theme of the paper is improving air quality prediction in urban areas, which directly relates
    to environmental health and pollution management, key aspects of sustainable development.
  quote: Calculating an Air Quality Index (AQI) typically uses data streams from air quality sensors deployed at fixed locations
    and the calculation is a real time process.
primary_category:
  value: Pollution
  justification: The primary focus of the paper is on predicting and managing air quality, which falls under the Pollution
    category as it deals directly with air pollution prediction and data management.
  quote: The Urban Life and Air Pollution task at MediaEval 2022 required participants to predict the air quality index (AQI)
    value at +1, +5 and +7 days ...
secondary_categories:
- value: Climate Change Mitigation
  justification: While the focus is on air pollution prediction, improving data management and prediction accuracy can indirectly
    contribute to climate change mitigation by enabling better air quality management.
  quote: Gaps in air quality datasets are common with the problem exacerbated for data gathered in poorer or developing countries
    ...
primary_sub_category:
  value: Air Pollution
  justification: The paper's main focus is on air quality prediction and managing data gaps, both of which are directly related
    to the subsection of Air Pollution under the Pollution category.
  quote: '... uses multimodal and crossmodal data consisting of AQI, weather and CCTV traffic images for air pollution prediction.'
