title:
  value: A Comparative Study of Machine Learning and Deep Learning Techniques for Prediction of CO2 Emission in Cars
  justification: The title clearly describes the main focus of the paper, which is comparing different AI techniques for predicting
    CO2 emissions in cars.
  quote: 'Title of the paper: A Comparative Study of Machine Learning and Deep Learning Techniques for Prediction of CO2 Emission
    in Cars'
description: The paper evaluates various machine learning and deep learning techniques to predict CO2 emissions from cars.
  It highlights the discrepancies in CO2 emissions data supplied by the government and aims to employ AI for accurate prediction
  of vehicular emissions to inform climate-related policy decisions, like the adoption of electric vehicles. The study compares
  models such as Random Forest, XGBoost, and Neural Networks, and explores ensemble techniques for improved predictions.
sustainable_development_is_central:
  value: true
  justification: The paper focuses on predicting CO2 emissions from vehicles, which is directly related to climate change
    as it deals with greenhouse gas emissions from one of the major contributing sectors, transportation.
  quote: The most recent concern of all people on the Earth is the increase in the concentration of greenhouse gas in the
    atmosphere. To estimate emissions from vehicles, we used machine learning, deep learning, and ensemble learning on a massive
    dataset.
primary_category:
  value: Climate Change Mitigation
  justification: The primary focus of the paper is on reducing CO2 emissions from cars by improving their prediction, which
    is a critical part of mitigating climate change impacts.
  quote: This can further be used to predict the rise in global temperature and also anchor important policy decisions such
    as shifting to electric vehicles.
