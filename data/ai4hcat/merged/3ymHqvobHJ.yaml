title:
  value: 'AfriQA: Cross-lingual Open-Retrieval Question Answering for African Languages'
  justification: The paper focuses on the creation of a cross-lingual QA dataset specifically for African languages.
  quote: To this end, we create AfriQA, the first cross-lingual QA dataset with a focus on African languages.
description: The paper introduces AfriQA, a cross-lingual question answering dataset designed to improve digital content accessibility
  for African languages. It includes 12,000+ examples across 10 African languages and evaluates various machine translation
  and retrieval systems for better multilingual QA technology.
sustainable_development_is_central:
  value: false
  justification: The primary focus of the paper is on enhancing language technology for African languages, with no direct
    emphasis on Climate or Ecological Sustainable Development.
  quote: "Cross-lingual open-retrieval question answering (XOR QA) systems\u2014those that retrieve answer content from other\
    \ languages while serving people in their native language\u2014offer a means of filling this gap."
