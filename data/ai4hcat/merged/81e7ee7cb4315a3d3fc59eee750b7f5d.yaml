title:
  value: Empirical Analysis of Model Selection for Heterogeneous Causal Effect Estimation
  justification: The paper focuses on the problem of model selection in causal inference for conditional average treatment
    effect (CATE) estimation, performing an empirical study to analyze various surrogate model selection metrics.
  quote: We study the problem of model selection in causal inference, specifically for conditional average treatment effect
    (CATE) estimation.
description: This paper provides an empirical analysis for model selection in causal inference, focusing specifically on CATE
  estimation. It evaluates a wide range of surrogate metrics used for model selection by benchmarking them across 78 datasets
  and proposes new strategies, including two-level model selection and causal ensembling, to enhance the model selection process.
  The study examines the effectiveness of 34 surrogate metrics for CATE estimation, using AutoML for tuning and generative
  modeling to ensure reliable benchmarks.
