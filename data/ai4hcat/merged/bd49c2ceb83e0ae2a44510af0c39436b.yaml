  justification: While the paper discusses a technology (autonomous driving) that can have implications for climate sustainability,
    such as potentially reducing emissions through efficient driving, the study does not explicitly frame its intention or
    results within climate or ecological sustainable development goals.
  quote: Overall, this gives rise to poor performance in newer benchmarks, eventually misleading non-expert readers and new
    practitioners in the field regarding the potential of vision-based pure EtE-AD.
