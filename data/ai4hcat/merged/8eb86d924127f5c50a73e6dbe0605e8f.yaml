title:
  value: Single Allocation Hub Location with Heterogeneous Economies of Scale
  justification: The title directly describes the main problem addressed in the paper, which is about optimizing hub location
    considering variable economies of scale.
  quote: We study the single allocation hub location problem with heterogeneous economies of scale (SAHLP-h).
description: The paper addresses the optimization problem of single allocation hub locations while considering heterogeneous
  economies of scale. It proposes advanced mathematical models and decomposition methods, like mixed integer linear programming
  (MILP) and mixed integer quadratically constrained program (MIQCP), to handle this complexity efficiently. Extensive computational
  experiments are performed to validate the proposed models, demonstrating their efficacy in solving large-scale instances.
