title:
  value: A debriefing tool to acquire non-technical skills in trauma courses
  justification: The paper primarily focuses on describing a tool and methodology aimed at improving the acquisition of non-technical
    skills in trauma courses, which is highlighted in the title.
  quote: A debriefing tool to acquire non-technical skills in trauma courses
description: The paper evaluates the use of the PEARLS Healthcare Debriefing Tool within trauma simulation courses to develop
  non-technical skills such as communication, decision-making, leadership, and teamwork. It reports on the creation of a specific
  debriefing tool card for trauma scenarios, aiming to structure and improve the debriefing process in trauma education, with
  a focus on non-technical skills.
