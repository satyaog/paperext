title:
  value: 'Evaluation of a prenatal screening decision aid: A mixed methods pilot study'
  justification: The paper evaluates a decision aid specifically developed for prenatal screening decisions.
  quote: 'Background: We developed a decision aid (DA) to help pregnant women and their partners make informed decisions about
    prenatal screening for trisomy.'
description: The paper discusses the development and evaluation of a decision aid aimed at assisting pregnant women and their
  partners in making informed decisions about prenatal screening for trisomy. It involves a mixed-methods study conducted
  in Quebec City to determine the usefulness and acceptability of the decision aid among the participants.
