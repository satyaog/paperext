title:
  value: 'DASVDD: Deep Autoencoding Support Vector Data Descriptor for Anomaly Detection'
  justification: The paper proposes a novel method named DASVDD for anomaly detection using a combination of deep learning
    techniques.
  quote: "In this paper, we propose a novel anomaly detection algorithm inspired by DSVDD and Autoencoders. Our method, deep\
    \ autoencoding support vector data descriptor (DASVDD), trains an autoencoder instead of a vanilla neural network by simultaneously\
    \ minimizing the volume of the enclosing hypersphere in the learned latent representation of the encoder and the reconstruction\
    \ error of the decoder\u2019s output."
description: The paper introduces a new anomaly detection method called DASVDD, which combines deep autoencoders with a support
  vector data descriptor to detect anomalies across various datasets. The method minimizes the volume of the enclosing hypersphere
  on autoencoder representations while considering reconstruction errors, showing robust performance in multiple anomaly detection
  scenarios.
