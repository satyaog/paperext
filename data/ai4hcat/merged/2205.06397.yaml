- value: Climate Change Mitigation
  justification: By mitigating the impact of an invasive species using technology, it indirectly contributes to preserving
    agricultural productivity, which is linked to climate change mitigation.
  quote: To explore one avenue of computer vision applications for the invasive SLF problem, we implement the preliminary
    classifier into a simple app designed for users to use their mobile devices to rapidly understand whether or not an insect
    is the SLF.
