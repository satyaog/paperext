title:
  value: 'LANTERN-RD: Enabling Deep Learning for Mitigation of the Invasive Spotted Lanternfly'
  justification: The paper discusses the creation of LANTERN-RD, a dataset aimed at mitigating the invasive spotted lanternfly
    using deep learning.
  quote: 'LANTERN-RD: Enabling Deep Learning for Mitigation of the Invasive Spotted Lanternfly'
description: The paper presents LANTERN-RD, the first curated image dataset of the invasive spotted lanternfly and visually
  similar insects. It enables computer vision research aimed at mitigating the SLF's impact, which threatens local biodiversity
  and agricultural economies in places like the Northeastern United States and Japan. The dataset, alongside a baseline convolutional
  neural network (CNN) and a mobile classification application, empowers rapid identification and responsible public mitigation
  efforts.
sustainable_development_is_central:
  value: true
  justification: The paper explicitly focuses on mitigating the impact of the spotted lanternfly, an invasive species threatening
    biodiversity and agriculture, through the use of deep learning technologies.
  quote: To enable computer vision applications and motivate advancements to challenge the invasive SLF problem, we propose
    LANTERN-RD, the first curated image dataset of the spotted lanternfly and its lookalikes.
primary_category:
