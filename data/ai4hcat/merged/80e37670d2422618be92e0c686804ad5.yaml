title:
  value: Predicting Tactical Solutions to Operational Planning Problems under Imperfect Information
  justification: The title reflects the content of the paper which focuses on predicting tactical solutions in operational
    planning using machine learning and operations research.
  quote: This paper offers a methodological contribution at the intersection of machine learning and operations research.
    Namely, we propose a methodology to quickly predict expected tactical descriptions of operational solutions (TDOSs).
description: This paper integrates machine learning and operations research to develop a high-speed predictive methodology
  for tactical solutions in two-stage stochastic programming. It demonstrates this through an application in rail transportation
  load planning, predicting tactical descriptions of operational solutions under imperfect information.
