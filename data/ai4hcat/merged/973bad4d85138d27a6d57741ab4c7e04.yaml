title:
  value: 'GPS++: A N O PTIMISED H YBRID MPNN/T RANSFORMER FOR MOLECULAR P ROPERTY P REDICTION'
  justification: The title of the paper is accurately extracted from the document and gives a direct reference to the new
    model, GPS++, developed for molecular property prediction.
  quote: 'GPS++: A N O PTIMISED H YBRID MPNN/T RANSFORMER FOR MOLECULAR P ROPERTY P REDICTION'
description: This paper introduces GPS++, a hybrid MPNN/Transformer model optimized for the PCQM4Mv2 molecular property prediction
  task. The model uses MPNN and transformer layers, incorporating 3D atomic positions and auxiliary denoising tasks to predict
  properties like the HOMO-LUMO energy gap of molecules. It emphasizes scalability, efficiency in computation, and implementation
  on Graphcore IPU accelerators.
sustainable_development_is_central:
  value: false
  justification: The main focus of this study is on efficiently predicting molecular properties using a hybrid model, rather
    than directly addressing climate or ecological sustainable development challenges.
  quote: The PCQM4Mv2 dataset [Hu et al., 2021] is specifically aimed at aiding the development of machine learning methods
    for molecular property prediction.
