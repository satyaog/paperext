title:
  value: 'MasakhaNEWS: A Benchmark Dataset for News Topic Classification in African Languages'
  justification: The paper introduces MasakhaNEWS, a new benchmark dataset for news topic classification covering 16 African
    languages.
  quote: "In this paper, we develop MasakhaNEWS \u2014 a new benchmark dataset for news topic classification covering 16 languages\
    \ widely spoken in Africa."
description: The paper presents MasakhaNEWS, a benchmark dataset designed to address the under-representation of African languages
  in NLP research. It covers 16 languages and supports news topic classification with a consistent labeling scheme. Various
  machine learning models and techniques such as cross-lingual parameter-efficient fine-tuning and few-shot learning are evaluated
  on this dataset, demonstrating the potential for improving NLP capabilities in African languages.
