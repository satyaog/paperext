  justification: The core focus of the paper is to leverage AI to transform buildings into smart buildings, significantly
    reducing energy consumption and associated carbon emissions to mitigate climate change.
  quote: Smart buildings aim to mitigate climate change by reducing energy consumption and associated carbon emissions.
