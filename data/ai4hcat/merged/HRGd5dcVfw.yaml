title:
  value: Guiding The Last Layer in Federated Learning with Pre-Trained Models
  justification: The title is derived directly from the paper, indicating the main focus on guiding the last layer in federated
    learning using pre-trained models.
  quote: Guiding The Last Layer in Federated Learning with Pre-Trained Models Gwen Legate Concordia University, Mila Montreal,
    Canada
description: The paper discusses a method in Federated Learning (FL) using pre-trained models, focusing on improving the efficiency
  and performance of FL algorithms. It introduces a two-stage approach for transfer learning in the FL setting, initially
  using the Nearest Class Means (NCM) method to optimize the classification head followed by fine-tuning the entire model.
  This new approach aims to reduce communication and computation costs while enhancing model performance. The FedNCM allows
  efficient initialization and significant gains in FL settings, especially under non-iid data distributions.
