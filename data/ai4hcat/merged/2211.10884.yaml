title:
  value: 'Multi-scale Digital Twin: Developing a fast and physics-informed surrogate model for groundwater contamination with
    uncertain climate models'
  justification: The title of the paper is clearly stated at the start of the document along with the authors' information.
  quote: 'Multi-scale Digital Twin: Developing a fast and physics-informed surrogate model for groundwater contamination with
    uncertain climate models'
description: The paper presents a multi-scale digital twin model using machine learning and physics-informed approaches to
  predict groundwater contamination under uncertain climate scenarios. U-Net enhanced Fourier Neural Operator (U-FNO) and
  neural operator learning are utilized to solve PDEs for complex flow and transport simulations. The model incorporates multi-scale
  uncertainties in physical simulations, climate data clustering, and provides a surrogate model for real-time predictions
  to assist in site management and decision-making in response to climate changes.
sustainable_development_is_central:
  value: true
  justification: The paper focuses on groundwater contamination and its exacerbation due to climate change. It aims to improve
    environmental remediation and climate resilience by using advanced modeling techniques.
  quote: Climate change exacerbates the long-term site management problem because extreme precipitation and/or shifts in precipitation/evapotranspiration
    regimes could re-mobilize contaminants and proliferate affected groundwater.
