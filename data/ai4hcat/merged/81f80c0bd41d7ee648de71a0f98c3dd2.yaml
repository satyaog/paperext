title:
  value: An Empirical Study of Data Access Self-Admitted Technical Debt
  justification: The title clearly reflects the main focus of the paper, which is an empirical study of self-admitted technical
    debt in data access, as specified in the abstract and content of the paper.
  quote: We present a large-scale empirical study on the prevalence, composition, and evolution of SATD in data-intensive
    systems.
description: This paper investigates self-admitted technical debt (SATD) in data-intensive systems with a focus on data access
  logic. It conducts a large-scale empirical study analyzing the prevalence, composition, and evolution of SATDs in systems
  using relational and NoSQL databases. The paper introduces a taxonomy for SATD categories specific to data access and examines
  the introduction and removal circumstances of such debt.
