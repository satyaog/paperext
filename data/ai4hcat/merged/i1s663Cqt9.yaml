title:
  value: Empirical Study on Optimizer Selection for Out-of-Distribution Generalization
  justification: The paper is about examining the performance of various optimizers for out-of-distribution generalization.
  quote: In this study, we examine the performance of popular first-order optimizers for different classes of distributional
    shift under empirical risk minimization and invariant risk minimization.
description: This study systematically evaluates the performance of popular adaptive and non-adaptive first-order optimizers
  in tasks involving out-of-distribution (OOD) generalization in deep learning. It compares their effectiveness across various
  datasets and hyperparameter configurations, demonstrating that non-adaptive optimizers like momentum-based SGD often outperform
  adaptive ones like Adam in OOD settings. The research provides practitioners with insights into choosing optimizers for
  better OOD performance.
