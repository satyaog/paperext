title:
  value: 'WATCH: Wasserstein Change Point Detection for High-Dimensional Time Series Data'
  justification: The paper introduces a novel method named WATCH, which leverages Wasserstein distance for change point detection
    in high-dimensional time series data.
  quote: In this paper, we attempt to fill this gap by proposing WATCH, a novel Wasserstein distance-based change point detection
    approach that models an initial distribution and monitors its behavior while processing new data points.
description: The paper presents WATCH, a Wasserstein distance-based method for change point detection designed specifically
  for high-dimensional and multivariate time series data. It addresses the limitations of existing methods by offering a robust
  approach to detect changes in dynamic datasets relevant in areas such as smart grids and traffic flow prediction.
