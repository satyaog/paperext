title:
  value: Dynamic Price of Parking Service based on Deep Learning
  justification: The title is extracted directly from the paper as given.
  quote: Dynamic Price of Parking Service based on Deep Learning
description: The paper proposes a dynamic pricing system for regulated parking services based on air quality predictions using
  deep learning. The goal is to discourage parking of motor vehicles when poor air quality episodes are predicted to improve
  urban air quality in Madrid, Spain. Several deep learning models, including CNN and LSTM, are evaluated for their effectiveness
  in predicting air quality alerts and adjusting parking prices accordingly.
