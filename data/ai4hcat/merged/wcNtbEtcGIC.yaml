title:
  value: Robust and Controllable Object-Centric Learning through Energy-based Models
  justification: The title of the paper clearly outlines the focus on object-centric learning using energy-based models to
    achieve robustness and control.
  quote: Robust and Controllable Object-Centric Learning through Energy-based Models
description: This paper introduces EGO, a framework for learning object-centric representations through energy-based models.
  By leveraging vanilla attention mechanisms and permutation-invariant energy functions, EGO can infer object-centric latent
  variables without supervised data. The framework shows promise in tasks like unsupervised object discovery, scene decomposition,
  and manipulation.
