title:
  value: Disaster Tweets Classification using BERT-Based Language Model
  justification: The title is explicitly mentioned at the beginning of the paper's abstract.
  quote: Disaster Tweets Classification using BERT-Based Language Model
description: The paper discusses the development of a machine learning language model using BERT to classify tweets as indicating
  'Disaster' or 'Not Disaster'. The aim is to aid disaster relief organizations by automating the detection of emergencies
  based on Twitter data. The model addresses challenges associated with processing social media text, including data cleansing
  and hyperparameter optimization.
