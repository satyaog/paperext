title:
  value: 'Forecasting Sensor Values in Waste-To-Fuel Plants: a Case Study'
  justification: The title is clearly mentioned at the beginning of the document.
  quote: 'Forecasting Sensor Values in Waste-To-Fuel Plants: a Case Study.'
description: This research paper develops machine learning models to predict future sensor readings of a waste-to-fuel plant,
  enabling proactive control of the plant's operations. The study involves different modeling approaches to predict sensor
  values based on historical data from a real-world use case in Canada. The aim is to facilitate better optimization, control,
  and decision-making in waste-to-fuel production processes that convert organic waste into high-quality diesel.
sustainable_development_is_central:
  value: true
  justification: The paper focuses on optimizing waste-to-fuel processes, emphasizing better waste management and reducing
    reliance on fossil fuels, which are key elements of sustainable development.
  quote: Organic wastes in energy conversion technologies are an active area of research aimed at reducing dependence on fossil
    fuels, optimizing production costs, improving waste management, and controlling emissions.
primary_category:
  value: Pollution
  justification: The primary focus of the study is on waste-to-fuel conversion processes, optimizing these operations to manage
    waste more effectively while producing synthetic diesel from organic waste, addressing waste issues which align under
    Pollution.
  quote: The JEMS waste-to-fuel plant produces synthetic diesel (SynDi) from any hydrocarbon-based waste, such as wood, biomass,
    paper, waste fuels and oils, plastics, textiles, rubber, and agricultural residues.
secondary_categories:
- value: Climate Change Mitigation
  justification: The study supports climate change mitigation by focusing on waste-to-fuel processes which reduce emissions
    and reliance on fossil fuels.
  quote: Organic wastes in energy conversion technologies are an active area of research aimed at reducing dependence on fossil
    fuels, optimizing production costs, improving waste management, and controlling emissions.
primary_sub_category:
  value: Waste
  justification: The central theme revolves around using waste-to-fuel technology to manage waste, optimize processes, and
    produce biofuel, which fits within the Waste sub-category.
  quote: The plant uses a chemical-catalytic de-polymerization process, the advantage of which is that the temperature is
    too low to produce carcinogenic gasses. It operates continuously and produces about 150 liters of fuel per hour.
secondary_sub_categories:
- value: Industry
  justification: The application of machine learning in optimizing process control in the waste-to-fuel industry highlights
    its secondary focus on industrial process improvement.
  quote: "This research, we develop machine learning models to predict future sensor readings of a waste-to-fuel plant, which\
    \ would enable proactive control of the plant\u2019s operations."
