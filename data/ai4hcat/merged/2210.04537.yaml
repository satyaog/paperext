title:
  value: Towards an efficient and risk aware strategy for guiding farmers in identifying best crop management
  justification: The title directly aligns with the content of the paper, which discusses strategies for guiding farmers in
    crop management using a bandit algorithm.
  quote: Towards an efficient and risk aware strategy for guiding farmers in identifying best crop management
description: This paper presents a strategy for guiding farmers in identifying the best crop management practices using a
  bandit algorithm. The authors propose a risk-aware approach to minimize farmers' losses during the identification of optimal
  fertilizer practices, using Conditional Value-at-Risk (CVaR) and Yield Excess (YE) as metrics. The study demonstrates the
  effectiveness of the bandit algorithm over traditional methods through simulations in Southern Mali, focusing on nitrogen
  fertilization for maize production.
