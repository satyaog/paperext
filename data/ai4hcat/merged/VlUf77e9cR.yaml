title:
  value: Lie Point Symmetry and Physics Informed Neural Networks
  justification: The title of the paper is clearly stated at the beginning, highlighting the focus on Lie Point Symmetry and
    Physics Informed Neural Networks.
  quote: Lie Point Symmetry and Physics Informed Neural Networks Tara Akhound-Sadegh 1 2 Laurence Perreault-Levasseur 3 2
    4 Johannes Brandstetter 5 Max Welling 6 5 Siamak Ravanbakhsh 1 2
description: This paper explores the enhancement of Physics-Informed Neural Networks (PINNs) by leveraging Lie point symmetries
  in partial differential equations (PDEs) to improve computational efficiency and accuracy. It introduces a new loss function
  that incorporates these symmetries, leading to better generalization and sample efficiency in neural PDE solvers.
