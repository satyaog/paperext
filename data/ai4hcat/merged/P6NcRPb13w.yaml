title:
  value: Adjusting Machine Learning Decisions for Equal Opportunity and Counterfactual Fairness
  justification: The paper focuses on adjusting machine learning decisions to ensure fairness in terms of equal opportunity
    and counterfactual fairness.
  quote: In this paper, we propose two algorithms that adjust fitted ML predictors to produce decisions that are fair. Our
    methods provide post-hoc adjustments to the predictors, without requiring that they be retrained.
description: The paper discusses the development of two algorithms to adjust machine learning decisions to ensure fairness.
  The algorithms focus on maintaining equal counterfactual opportunity and counterfactual fairness in high-stakes decisions
  such as admissions, income, credit, and recidivism. The methods allow post-hoc adjustments to machine learning models to
  adhere to fairness criteria without retraining the models.
