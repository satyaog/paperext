title:
  value: 'EpiK-Eval: Evaluation for Language Models as Epistemic Models'
  justification: The title was directly extracted from the paper, indicating the introduction of a benchmark tailored to evaluate
    language models.
  quote: "This paper presents the first study examining the capability of LLMs to effectively combine such information within\
    \ their parameter space. We introduce EpiK-Eval, a novel question-answering benchmark tailored to evaluate LLMs\u2019\
    \ proficiency in formulating a coherent and consistent knowledge representation from segmented narratives."
description: The paper introduces EpiK-Eval, a novel question-answering benchmark for evaluating large language models (LLMs)
  in their ability to consolidate knowledge from segmented narratives. This assessment aims to determine if LLMs can maintain
  a coherent and consistent knowledge state, an essential trait for effective reasoning and applications. Evaluations show
  significant weaknesses in LLMs' ability to consolidate knowledge, suggesting a need for refining training objectives to
  enhance their reasoning capabilities.
