  justification: The title is directly taken from the header of the paper.
  quote: Environmental and Social Sustainability of Creative-Ai
description: The paper investigates the sustainability and ethical aspects of using Creative-AI in artistic processes. It
  examines environmental sustainability in AI arts and ethical issues concerning power, authorship, and ownership in the creative
  process, using interdisciplinary approaches combining various research methods. The research aims to develop ethical guidelines
  and sustainable practices for integrating AI in art creation.
