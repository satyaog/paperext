title:
  value: 'GAUCHE: A Library for Gaussian Processes in Chemistry'
  justification: The title of the paper is clearly stated at the beginning of the document, indicating that it is focused
    on a library called GAUCHE designed for Gaussian Processes in Chemistry.
  quote: We introduce GAUCHE, an open-source library for GAUssian processes in CHEmistry.
description: This paper introduces GAUCHE, an open-source library designed to facilitate the use of Gaussian processes in
  chemistry. It provides a robust and user-friendly framework for molecular discovery, chemical reaction optimization, and
  protein design by offering specialized kernels for various molecular representations.
