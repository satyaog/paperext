title:
  value: Deciphering Environmental Air Pollution with Large Scale City Data
  justification: The title accurately reflects the paper's focus on using large-scale city data to understand and address
    environmental air pollution.
  quote: Deciphering Environmental Air Pollution with Large Scale City Data
description: The paper presents a large-scale curated spatiotemporal dataset incorporating daily levels of various air pollutants
  and the major causal agents in over 50 U.S. cities for two years. It introduces a novel transformer-based model, cosSquareFormer,
  for pollutant level estimation and forecasting and provides a holistic analysis of the dataset. It aims to uncover relationships
  among pollutant levels and influencing factors. The dataset is intended to aid further research in urban air pollution.
