title:
  value: 'Doubly Right Object Recognition: A Why Prompt for Visual Rationales'
  justification: The paper introduces a 'doubly right' benchmark for object recognition that requires models to provide not
    only the correct categorical predictions but also the correct rationales for these predictions.
  quote: We propose a 'doubly right' object recognition benchmark, where the metric requires the model to simultaneously produce
    both the right labels as well as the right rationales.
description: This paper explores the capability of computer vision models to not only provide accurate categorical labels
  for objects in images but also to give correct rationales for their predictions. It introduces a benchmark for 'doubly right'
  object recognition and proposes a 'why prompt' approach to improve the ability of models to generate correct rationales
  by adapting language model insights into visual models. This approach aims to enhance explainability and user trust in AI
  systems.
