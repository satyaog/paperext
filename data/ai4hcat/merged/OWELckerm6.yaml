title:
  value: 'LAUGHING HYENA DISTILLERY: Extracting Compact Recurrences From Convolutions'
  justification: The paper introduces and discusses a method called 'Laughing Hyena Distillery' for creating compact state-space
    models from long convolution sequence models, aiming to improve memory efficiency and throughput during generation.
  quote: In this paper, we seek to enable O(1) compute and memory cost per token in any pre-trained long convolution architecture...
description: The paper presents the Laughing Hyena Distillery method, which aims to extract compact recurrences from convolutional
  sequence models to improve the efficiency of autoregressive generation. This method employs state-space models to achieve
  constant memory and computational costs, allowing for more efficient processing and larger batch sizes during inference,
  without loss in quality. The approach involves techniques like rational interpolation and model-order reduction, achieving
  significant improvements in throughput over existing models such as Transformers and Hyena.
