description: This paper presents Feature Conformal Prediction (Feature CP), which extends conventional conformal prediction
  to semantic feature spaces using deep representation learning. The authors demonstrate the theoretical and practical benefits
  of this approach, improving prediction intervals and showcasing its application in tasks such as ImageNet classification
  and Cityscapes image segmentation.
