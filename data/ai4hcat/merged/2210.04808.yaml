title:
  value: A stochastic integer programming approach to reserve staff scheduling with preferences
  justification: The title accurately reflects the focus of the research paper, which is about developing a stochastic integer
    programming model for reserve staff scheduling, emphasizing employee preferences.
  quote: Title of the paper is 'A stochastic integer programming approach to reserve staff scheduling with preferences'.
description: The paper discusses a new approach to the personnel scheduling problem focusing on unstudied operational issues
  in the transit industry. It introduces a two-stage stochastic integer programming model to schedule reserve staff (extra
  boards) while considering employee preferences to improve their satisfaction and attendance. The research emphasizes the
  importance of preference-based scheduling in reducing employee absenteeism and improving service reliability. It uses data
  from Los Angeles to validate the proposed model, showing significant improvements in social welfare and reduced service
  cancellations if preferences are considered in scheduling.
