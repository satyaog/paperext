  justification: The paper primarily focuses on operational optimization in mobile edge computing environments to prevent
    node overload, which does not directly align with the defined categories for climate or ecological sustainable development.
  quote: 'The performance and

    reliability of MEC are degraded significantly when one or several

    edge servers in the cluster are overloaded. Especially when a

    server crashes due to the overload, it causes service failures

    in MEC.'
