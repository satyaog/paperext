title:
  value: 'SARS-CoV-2 infection in Africa: a systematic review and meta-analysis of standardised seroprevalence studies, from
    January 2020 to December 2021'
  justification: The title is directly taken from the paper and clearly represents the content of the study which is focused
    on SARS-CoV-2 seroprevalence in Africa.
  quote: "SARS-\xADCoV-\xAD2 infection in Africa: a systematic review and meta-\xADanalysis of standardised seroprevalence\
    \ studies, from January 2020 to December 2021"
description: This paper presents a systematic review and meta-analysis of seroprevalence studies conducted in Africa to estimate
  the seroprevalence of SARS-CoV-2 from January 2020 to December 2021. It highlights the challenges in detecting COVID-19
  incidence in Africa due to limited surveillance and lab capacities. The study aims to inform public health decision-making
  by understanding the population's exposure and guiding targeted public health policies.
