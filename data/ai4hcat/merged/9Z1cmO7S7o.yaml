title:
  value: Generating QM1B with PySCFIPU
  justification: The paper focuses on the introduction and implementation of a new data generator called PySCFIPU, which is
    used to create large quantum chemistry datasets.
  quote: In this paper, we take a first step towards utilising hardware accelerators by introducing the data generator PySCFIPU
    using Intelligence Processing Units (IPUs).
description: The paper introduces PySCFIPU, a hardware-accelerated data generator using Intelligence Processing Units (IPUs)
  for the rapid creation of large datasets for quantum chemistry, specifically aiming to facilitate deep learning models'
  training in molecular machine learning. The dataset QM1B with one billion examples is generated, highlighting the importance
  of dataset scale in improving baseline neural networks' performance without additional inductive biases. The work emphasizes
  a shift towards large-scale training sets to enhance neural networks' ability to model quantum chemical predictions efficiently.
