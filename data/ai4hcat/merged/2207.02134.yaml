title:
  value: Balancing Profit, Risk, and Sustainability for Portfolio Management
  justification: The title clearly encapsulates the main themes of the paper, focusing on balancing profit, risk, and sustainability
    in portfolio management.
  quote: Balancing Profit, Risk, and Sustainability for Portfolio Management.
description: The paper explores stock portfolio optimization using reinforcement learning, focusing on a novel utility function
  that considers profit, risk, and sustainability. The paper introduces a system that evaluates financial returns, risk (through
  the Sharpe ratio), and sustainability (through ESG scores) in portfolio management.
sustainable_development_is_central:
  value: true
  justification: The integration of sustainability through ESG scores in portfolio optimization makes sustainability a central
    theme of the paper.
  quote: '...environmental, social, and governance score (ESG) representing sustainability...'
primary_category:
  value: Sustainable Finance
  justification: The paper primarily deals with financial strategies through portfolio optimization, focusing on ESG, which
    aligns with sustainable finance.
  quote: '...incorporating risk and sustainability criteria in the utility function, we improve on the state-of-the-art in
    reinforcement learning for portfolio optimization...'
