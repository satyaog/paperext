title:
  value: 'Interacting brains revisited: A cross-brain network neuroscience perspective'
  justification: The title is directly extracted from the beginning of the paper and accurately reflects the research focus
    on cross-brain network neuroscience.
  quote: 'Interacting brains revisited: A cross-brain network neuroscience perspective'
description: This paper proposes a comprehensive framework for studying interbrain networks using bipartite graphs to analyze
  social interactions. It examines the neural basis of social behavior by considering the synchronized activities of interacting
  individuals' brains. The study introduces methods to represent and predict social behaviors using graph-based interbrain
  networks and demonstrates the distinct neural processes during cooperative and competitive tasks.
