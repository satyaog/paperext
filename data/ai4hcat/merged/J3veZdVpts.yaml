title:
  value: Bridging the Gap Between Offline and Online Reinforcement Learning Evaluation Methodologies
  justification: The title clearly indicates that the paper focuses on the methodologies to evaluate offline and online reinforcement
    learning.
  quote: Bridging the Gap Between Offline and Online Reinforcement Learning Evaluation Methodologies
description: This paper proposes a sequential approach to evaluate offline reinforcement learning algorithms by using data
  efficiency as a metric, termed Sequential Evaluation (SeqEval). The authors detail how this evaluation provides insights
  into the algorithms' data efficiency and robustness to dataset distribution changes. The paper further demonstrates this
  approach through experiments comparing different offline RL algorithms.
