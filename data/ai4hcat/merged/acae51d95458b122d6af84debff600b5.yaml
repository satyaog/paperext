title:
  value: "30\xD730 biodiversity gains rely on national coordination"
  justification: The paper explores the implementation and effectiveness of the 30x30 biodiversity goal, emphasizing national
    coordination.
  quote: Global commitments to protect 30% of land by 2030 present an opportunity to combat the biodiversity crisis, but reducing
    extinction risk will depend on where countries expand protection.
description: This paper investigates the potential biodiversity gains that can result from coordinated national efforts to
  protect 30% of land by 2030. It uses Canada as a model to assess different conservation scenarios that prioritize biodiversity
  facets and coordinate protection strategies to maximize biodiversity capture in protected areas while considering climate
  change impacts.
sustainable_development_is_central:
  value: true
  justification: The central theme of the paper is about biodiversity conservation under the framework of protecting 30% of
    land by 2030, which directly relates to sustainability efforts in ecological systems.
  quote: "Protected areas are pivotal to biodiversity conservation, but existing networks are inadequate when it comes to\
    \ safeguarding Earth\u2019s biodiversity under climate change."
primary_category:
  value: Natural Systems Protection
  justification: The paper focuses on strategies for the protection and preservation of biodiversity, making 'Natural Systems
    Protection' the most relevant category.
  quote: Global commitments to protect 30% of land by 2030 present an opportunity to combat the biodiversity crisis, but reducing
    extinction risk will depend on where countries expand protection.
secondary_categories:
- value: Climate Change Adaptation
  justification: The paper addresses the need to incorporate climate change into spatial planning for conservation, highlighting
    the importance of climate adaptations strategies.
  quote: Our results show that nationally coordinated strategies can enable large conservation gains and efficiently serve
    global goals, while also benefiting regional conservation projects by providing broader context for local decisions.
primary_sub_category:
  value: Biodiversity
  justification: The sub-category of 'Biodiversity' aligns with the paper's focus on conserving a wide range of species and
    biodiversity facets within the 30x30 framework.
  quote: Here, we explore how different approaches to reaching 30x30 incur trade-offs and impact our ability to protect a
    broad range of biodiversity.
