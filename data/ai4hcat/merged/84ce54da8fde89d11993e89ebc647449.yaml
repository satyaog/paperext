title:
  value: 'The generalizability of pre-processing techniques on the accuracy and fairness of data-driven building models: A
    case study'
  justification: The title explicitly states the focus on analyzing pre-processing techniques for data-driven building models,
    with an emphasis on accuracy and fairness.
  quote: 'The generalizability of pre-processing techniques on the accuracy and fairness of data-driven building models: A
    case study'
description: This paper examines the effectiveness of different pre-processing techniques on the accuracy and fairness of
  data-driven building models (DDBMs) used for predicting lighting status in buildings. It introduces a new technique called
  sequentially balanced sampling (SBS) and compares it with existing methods to handle data distribution imbalances. The study
  conducts simulations on lighting data to evaluate these techniques in terms of their impact on predictive accuracy and fairness,
  with implications for improving DDBM performance.
