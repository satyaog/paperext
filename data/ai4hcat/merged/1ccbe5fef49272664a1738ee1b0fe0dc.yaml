primary_sub_category:
  value: Industry
  justification: The paper specifically addresses innovations in catalyst design which are used in industrial processes, hence
    aligning with the 'Industry' sub-category under Climate Change Mitigation.
  quote: Catalyst materials play a crucial role in the electrochemical reactions involved in numerous industrial processes
    key to this transition.
