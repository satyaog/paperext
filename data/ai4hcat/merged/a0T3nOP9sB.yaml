title:
  value: Adaptive patch foraging in deep reinforcement learning agents
  justification: The title accurately represents the core study of the paper, which investigates reinforcement learning agents'
    behavior in patch foraging tasks.
  quote: 'Title of the paper: Adaptive patch foraging in deep reinforcement learning agents'
description: This paper studies the behavior of deep reinforcement learning agents in ecological patch foraging tasks. It
  explores how these agents can learn optimal foraging behavior, similar to biological foragers, within a simulated environment.
  The research connects internal dynamics of AI agents to neural recordings from foraging animals, providing insights into
  both artificial and biological intelligence systems.
