title:
  value: 'CADet: Fully Self-Supervised Anomaly Detection With Contrastive Learning'
  justification: The title effectively summarizes the focus of the paper which is on CADet, a method for self-supervised anomaly
    detection using contrastive learning techniques.
  quote: 'CADet: Fully Self-Supervised Anomaly Detection With Contrastive Learning'
description: The paper introduces CADet, a novel fully self-supervised method for anomaly detection based on contrastive learning
  and maximum mean discrepancy (MMD). The method is designed to detect out-of-distribution (OOD) samples including both unseen
  classes and adversarial perturbations. It leverages self-supervised contrastive learning paired with MMD to robustly identify
  whether two sample sets originate from the same distribution, outperforming current methods in adversarial detection and
  performing comparably in label-based OOD detection without needing OOD examples for training or tuning.
