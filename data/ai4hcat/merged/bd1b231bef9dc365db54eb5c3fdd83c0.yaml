title:
  value: 'Environmental Risk of Psychiatric Disease: A Systematic Review on Air Pollution, Mental Health, and Frontolimbic
    Brain Regions'
  justification: The title explicitly mentions the environmental risk of psychiatric disease, focusing on air pollution and
    its effects on mental health and brain regions.
  quote: 'P395. Environmental Risk of Psychiatric Disease: A Systematic Review on Air Pollution, Mental Health, and Frontolimbic
    Brain Regions'
description: This paper systematically reviews existing literature on the effects of air pollution on mental health, particularly
  in relation to anxiety and depressive disorders. It investigates the association between air pollutants and structural/functional
  changes in brain regions such as the hippocampus and prefrontal cortex, which are implicated in psychopathology.
