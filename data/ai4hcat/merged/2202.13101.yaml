title:
  value: Sustainability using Renewable Electricity (SuRE) towards NetZero Emissions
  justification: The title clearly indicates the focus on sustainability using renewable electricity to achieve net-zero emissions,
    which is central to the paper.
  quote: Sustainability using Renewable Electricity (SuRE) towards NetZero Emissions
description: The paper presents a scalable AI-based solution to help organizations increase their renewable electricity consumption,
  providing energy demand forecasts and carbon offset recommendations to achieve Net-Zero emissions. It focuses on optimizing
  the use of renewable energy in commercial buildings through predictive analytics.
sustainable_development_is_central:
  value: true
  justification: The paper's focus on increasing renewable energy share and reducing carbon emissions explicitly targets sustainable
    development goals related to climate mitigation and energy transition.
  quote: As a step towards achieving Net-Zero emission target, we present a scalable AI based solution that can be used by
    organizations to increase their overall renewable electricity share in total energy consumption.
primary_category:
  value: Climate Change Mitigation
  justification: The primary theme is reducing carbon footprints through increased renewable energy use, aligning with climate
    change mitigation efforts.
  quote: To achieve Net-Zero emissions by 2050, major portion of this reduction is hence attributed to come by increasing
    the renewable energy share in the overall consumption.
secondary_categories: []
primary_sub_category:
  value: Renewable Energy and Grid Optimization
  justification: The paper discusses optimizing renewable electricity consumption in buildings, a core aspect of grid optimization
    for renewables.
  quote: The SuRE application provides AI based models for energy demand forecasting which in turn is used for optimal recommendation
    for procurement of green power.
