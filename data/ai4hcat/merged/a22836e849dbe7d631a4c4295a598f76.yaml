title:
  value: Robustness assessment of hyperspectral image CNNs using metamorphic testing
  justification: The title accurately reflects the main focus of the paper, which is assessing the robustness of CNNs used
    for classifying hyperspectral images using metamorphic testing methods.
  quote: Robustness assessment of hyperspectral image CNNs using metamorphic testing
description: The paper explores the robustness of convolutional neural networks (CNNs) in classifying hyperspectral images
  (HSIs) using metamorphic testing. It addresses the sensitivity of deep learning classifiers to input perturbations, especially
  in safety-critical applications, and proposes a systematic testing method leveraging metamorphic transformations to simulate
  distortions in HSIs. The study finds that fine-tuning CNNs with failure-revealing transformations improves robustness significantly
  without major performance loss.
