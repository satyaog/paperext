title:
  value: 'Technology-enhanced trauma training in low-resource settings: A scoping review and feasibility analysis of educational
    technologies'
  justification: The title provides a concise summary of the paper's focus on technology-enhanced trauma training in low-resource
    settings, specifically examining the feasibility of different educational technologies for low- and middle-income countries.
  quote: 'Technology-enhanced trauma training in low-resource settings: A scoping review and feasibility analysis of educational
    technologies'
description: This paper investigates the use of educational technologies to improve trauma training in low- and lower-middle-income
  countries (LMICs). It conducts a scoping review of existing technologies used in trauma courses and evaluates their feasibility
  for use in LMICs. The study found that high-fidelity mannequins, though effective, were not suitable due to high costs and
  maintenance challenges, while virtual simulation and digital courses showed higher feasibility scores for these settings.
