[dir]
root = .
data = ${root}/data
cache = ${data}/cache
merged = ${data}/${platform:struct}/merged
queries = ${data}/${platform:struct}/queries
evaluation = ${data}/${platform:struct}/evaluation
evaluation_dom_cat = ${evaluation}/domain_categories
evaluation_mod_cat = ${evaluation}/model_categories
paperoni = ${root}/paperoni
log = ${root}/logs

[env]
LLAMA_CLOUD_API_KEY =
OLLAMA_HOST = ${ollama:host}
OPENAI_API_KEY =
OPENAI_ORG_ID =
OPENAI_PROJECT_ID =
PAPERONI_CONFIG = ${dir:paperoni}/config.yaml

[platform]
select = llamaparse
struct = parse_doc

[llamaparse]
model = balance

[ollama]
model = deepseek-r1:32b
host = localhost:11434
url = http://${host}/v1

[openai]
model = gpt-4o

[vertexai]
project =
model = models/gemini-1.5-pro

[paperoni]
url = https://paperoni.mila.quebec

[evaluation]
collapse_cat = true
dom_cat = milabenchv1
mod_cat = milabenchv1

[logging]
level = NOTSET
